global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  # Internal telemetry
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Application (FastAPI)
  - job_name: "fastapi-backend"
    metrics_path: "/metrics"
    scrape_interval: 10s
    static_configs:
      - targets: ["backend:8000"]
        labels:
          app: "skilio-backend"
          environment: "development"

  # Database (PostgreSQL)
  - job_name: "postgres"
    scrape_interval: 15s
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          app: "skilio-postgres"
          environment: "development"

  # Infrastructure (cAdvisor)
  - job_name: "cadvisor"
    scrape_interval: 15s
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          app: "skilio-containers"
          environment: "development"


