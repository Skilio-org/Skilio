services:

  proxy:
    user: ":0"
    command:
      - --providers.docker
      - --providers.docker.exposedbydefault=false
      - --entrypoints.http.address=:80
      - --accesslog
      - --log
      - --log.level=DEBUG
      - --api
      - --api.insecure=true
    volumes:
      - "${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro"
    ports:
      - "${PROXY_PORT:-80}:80"
      - "8090:8080"


  db:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"


  backend:
    command:
      - bash
      - -c
      - "bash scripts/prestart.sh && fastapi dev --host 0.0.0.0"
    environment:
      SMTP_HOST: "mailpit"
    ports:
      - "8000:8000"


  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"


  prometheus:
    ports:
      - "9090:9090"

  grafana:
    ports:
      - "3000:3000"
