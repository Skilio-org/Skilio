
<div id="erd" style="padding: 1rem 0"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    fontSize: '13px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: '#73726c',
    textColor: '#191919',
  },
});

const diagram = `erDiagram
  USER {
    uuid id PK
    string email
    string hashed_password
    string full_name
    string avatar_url
    enum role
    bool is_active
    bool is_verified
    timestamp created_at
    timestamp updated_at
  }

  FREELANCER_PROFILE {
    uuid id PK
    uuid user_id FK
    string bio
    string city
    string country
    string phone
    float avg_rating
    int review_count
    bool is_available
    timestamp created_at
    timestamp updated_at
  }

  CATEGORY {
    uuid id PK
    string name
    string slug
    string icon_url
    uuid parent_id FK
  }

  SERVICE {
    uuid id PK
    uuid freelancer_profile_id FK
    uuid category_id FK
    string title
    string description
    decimal starting_price
    string price_unit
    bool is_active
    timestamp created_at
    timestamp updated_at
  }

  SKILL {
    uuid id PK
    string name
    string slug
  }

  FREELANCER_SKILL {
    uuid freelancer_profile_id FK
    uuid skill_id FK
  }

  PORTFOLIO_ITEM {
    uuid id PK
    uuid freelancer_profile_id FK
    string title
    string description
    string media_url
    timestamp created_at
  }

  CONTACT_REQUEST {
    uuid id PK
    uuid client_user_id FK
    uuid service_id FK
    string message
    enum status
    timestamp created_at
    timestamp updated_at
  }

  REVIEW {
    uuid id PK
    uuid contact_request_id FK
    uuid reviewer_user_id FK
    uuid freelancer_profile_id FK
    int rating
    string comment
    timestamp created_at
  }

  USER ||--o| FREELANCER_PROFILE : "has"
  FREELANCER_PROFILE ||--o{ SERVICE : "offers"
  CATEGORY ||--o{ SERVICE : "classifies"
  CATEGORY ||--o{ CATEGORY : "parent of"
  FREELANCER_PROFILE ||--o{ FREELANCER_SKILL : "has"
  SKILL ||--o{ FREELANCER_SKILL : "tagged by"
  FREELANCER_PROFILE ||--o{ PORTFOLIO_ITEM : "showcases"
  USER ||--o{ CONTACT_REQUEST : "sends"
  SERVICE ||--o{ CONTACT_REQUEST : "receives"
  CONTACT_REQUEST ||--o| REVIEW : "yields"
  FREELANCER_PROFILE ||--o{ REVIEW : "receives"
`;

const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
