# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-added-large-files

      - id: check-toml

      - id: check-yaml
        args:
          - --unsafe

      - id: end-of-file-fixer
        exclude: |
          (?x)^(
              frontend/src/client/.*|
              backend/app/email-templates/.*
          )$

      - id: trailing-whitespace
        exclude: ^frontend/src/client/.*

  - repo: local
    hooks:
      # Frontend formatting only
      - id: local-biome-format
        name: biome format
        entry: bun run --filter frontend format
        language: system
        files: ^frontend/
        pass_filenames: false

      # Backend formatting only
      - id: local-ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      # Keep release-note helper
      - id: add-release-date
        name: add date to latest release header
        entry: uv run python scripts/add_latest_release_date.py
        language: system
        files: ^release-notes\.md$
        pass_filenames: false
