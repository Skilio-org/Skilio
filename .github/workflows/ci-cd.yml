name: CI/CD Pipeline & Production Deployment

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'devops/docs/**'
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:

  lint-backend:
    name: Python Syntax Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.18"
      - name: Run Ruff Syntax Checks
        run: uv run ruff check --select E9,F63,F7,F82 backend/

  lint-frontend:
    name: TypeScript & Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Install Dependencies
        run: bun install
        working-directory: frontend
      - name: Check TypeScript Compilation
        run: bun run build
        working-directory: frontend


  test-backend:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.18"

      - name: Start Test Database & Mailpit
        run: |
          cp .env.example .env
          docker compose up -d db mailpit

      - name: Run Database Migrations
        run: uv run bash scripts/prestart.sh
        working-directory: backend

      - name: Run Pytest & Coverage
        run: uv run bash scripts/tests-start.sh "Coverage for ${{ github.sha }}"
        working-directory: backend

      - name: Enforce 70% Minimum Coverage
        run: uv run coverage report --fail-under=70
        working-directory: backend

      - name: Upload HTML Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: backend/htmlcov


  test-docker-compose:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Environment
        run: cp .env.example .env

      - name: Build Docker Containers
        run: docker compose build

      - name: Run Database Migrations
        run: docker compose run --rm backend bash scripts/prestart.sh

      - name: Start Application Stack
        run: docker compose up -d --wait backend

      - name: Verify Backend Healthcheck
        run: curl -f --retry 5 --retry-delay 2 http://localhost:8000/api/v1/utils/health-check/

      - name: Verify Frontend Web Root
        run: curl -f --retry 5 --retry-delay 2 http://localhost:8000

      - name: Teardown Containers
        if: always()
        run: docker compose down -v --remove-orphans


  deploy:
    name: Continuous Deployment (AWS EC2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-backend, lint-frontend, test-backend, test-docker-compose]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Sync Codebase to Server
        run: |
          rsync -avz --delete \
            --exclude '.git*' \
            --exclude '.env*' \
            --exclude 'node_modules' \
            --exclude '.venv' \
            --exclude '__pycache__' \
            --exclude 'devops/backup/dumps' \
            ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/skilio/

      - name: Deploy Updated Backend Container
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} 'bash /opt/skilio/devops/scripts/deploy.sh'

      - name: Verify Live Production Health
        run: |
          echo "==> Probing live production health endpoint..."
          HEALTH_URL="https://skilio.works/api/v1/health"
          MAX_RETRIES=12
          RETRY_INTERVAL=5

          for ((i=1; i<=MAX_RETRIES; i++)); do
            if curl -fsSL "$HEALTH_URL" 2>/dev/null | grep -q '"status":"healthy"'; then
              echo "==> Production deployment verified successfully at $HEALTH_URL!"
              exit 0
            fi
            echo "==> Waiting for backend and ingress to become ready... (attempt $i/$MAX_RETRIES)"
            sleep $RETRY_INTERVAL
          done

          echo "==> Production health check failed after $((MAX_RETRIES * RETRY_INTERVAL)) seconds!"
          exit 1
