name: Lint & Code Quality

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-backend:
    name: Python Syntax Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.18"
      - name: Run Ruff Syntax Checks
        run: uv run ruff check --select E9,F63,F7,F82 backend/

  lint-frontend:
    name: TypeScript & Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Install Dependencies
        run: bun install
        working-directory: frontend
      - name: Check TypeScript Compilation
        run: bun run build
        working-directory: frontend
